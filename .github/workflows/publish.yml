name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are two jobs on purpose. When deploy-pages ran in the same
# job right after upload-pages-artifact, GitHub sometimes had not listed the new
# artifact yet ("Found 0 artifact(s)", 2026-11-20 and 11-22) and the run failed.
# The second job starts only after the upload is registered, and the deploy is
# retried once after a pause, so only a real outage fails the run.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build.mjs
      - name: Save the newest uploads
        id: save
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m 'Update latest uploads'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether to deploy
        id: decide
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        run: echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
